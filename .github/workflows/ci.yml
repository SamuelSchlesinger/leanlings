name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}

      - name: Build
        run: |
          lake build
          lake build Leanlings.Contracts

      - name: Run Leanlings regressions
        run: |
          lake env lean --run tests/LeanlingsRegression.lean
          python3 tests/LearnerWorkflow.py

      - name: Verify contract generation
        run: |
          python3 tests/ContractGeneration.py
          python3 scripts/generate-contracts.py --check

      - name: Verify every course and its checks
        run: |
          python3 scripts/validate-courses.py
          lake env lean tests/TeachingExamples.lean
          python3 scripts/validate-guides.py
